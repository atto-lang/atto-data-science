name: Data ML batch bridge (host-only)
on:
  pull_request:
    paths:
      - "src/pipeline/ml_batch_bridge.ores"
      - "examples/nullable_ml_batch_scatter.ores"
      - "tests/ml_batch_bridge_oracle.test.mjs"
      - "docs/ML_BATCH_PIPELINE_V1.md"
      - ".github/workflows/ml-batch-bridge.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run independent reference cases
        run: node --test tests/ml_batch_bridge_oracle.test.mjs
      - name: Mark evidence limitations
        run: echo "HOST_ONLY; ORESLANG_GUEST_EXECUTION=NOT_EXECUTED; TENSOR_ACCELERATION=NOT_EXECUTED"

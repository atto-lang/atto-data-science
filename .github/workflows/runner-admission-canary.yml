name: Source-free Actions admission canary

on:
  pull_request:
    paths:
      - '.github/workflows/runner-admission-canary.yml'
  workflow_dispatch:

permissions: {}

jobs:
  admission-canary:
    if: github.repository == 'ores-truffle-oreslang/oreslang-data-science'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Prove runner executed a shell step
        shell: bash
        run: |
          set -euo pipefail
          printf 'SOURCE_FREE_RUNNER_ADMITTED run=%s attempt=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"

name: NdArray ABI host reference (not native guest)

on:
  pull_request:
    paths:
      - 'scripts/verify_ndarray_layout.py'
      - 'tests/test_ndarray_*.py'
      - 'docs/NDARRAY_ABI_V1.md'
      - '.github/workflows/ndarray-abi.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/verify_ndarray_layout.py'
      - 'tests/test_ndarray_*.py'
      - 'docs/NDARRAY_ABI_V1.md'
      - '.github/workflows/ndarray-abi.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-reference:
    if: github.repository == 'ores-truffle-oreslang/oreslang-data-science'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout same-repository PR tree
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Exercise NdArray reference properties and adversarial leases
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          python3 -m unittest discover -s tests -p 'test_ndarray_*.py' -v
      - name: Classify evidence without guest-parity claims
        run: echo 'HOST_REFERENCE_ONLY_NOT_ORESLANG_GUEST_EXECUTION'
